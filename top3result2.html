<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <title>Overall Rank 1 Results</title>

  <style>

    /* RESET & BASE STYLES */

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

      font-family: Arial, sans-serif;

    }



    body {

      background-color: transparent;

      overflow: hidden;

    }



    /* BANNER CONTAINER */

    .ticker-container {

      width: 100%;

      background: linear-gradient(90deg, #3245d2, #ea384dea);

      color: white;

      background-color: #ea384dea;

      height: 50px;

      display: flex;

      align-items: center;

      position: relative;

      overflow: hidden;

      box-shadow: 0 4px 6px rgba(0,0,0,0.15);

    }



    /* STATIC BADGE */

    .badge {

      background-color: #8a0c1a;

      padding: 0 16px;

      height: 100%;

      display: flex;

      align-items: center;

      gap: 6px;

      font-weight: bold;

      font-size: 15px;

      z-index: 10;

      white-space: nowrap;

      box-shadow: 3px 0 6px rgba(0,0,0,0.2);

    }



    /* MARQUEE WRAPPER */

    .marquee-wrapper {

      width: 100%;

      overflow: hidden;

      white-space: nowrap;

    }



    /* MOVING TRACK */

    .marquee-track {

      display: inline-block;

      white-space: nowrap;

      padding-left: 100%;

      animation: scroll-left 120s linear infinite;

    }



    @keyframes scroll-left {

      0% { transform: translateX(0); }

      100% { transform: translateX(-100%); }

    }



    /* RUNNER CARD STYLING */

    .runner-pill {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      background: rgba(255, 255, 255, 0.2);

      padding: 4px 12px;

      border-radius: 20px;

      margin-right: 24px;

      font-size: 15px;

      font-weight: 500;

    }


        /* RANK */

    .rank {

      font-size: 15px;

      padding: 2px 6px;

      border-radius: 4px;

      text-transform: uppercase;

      font-weight: bold;

      background-color: rgba(148, 125, 193, 0.80);

      color: #fff;

    }

    /* CATEGORY */

    .category {

      font-size: 15px;

      padding: 2px 6px;

      border-radius: 4px;

      text-transform: uppercase;

      font-weight: bold;

      background-color: rgba(0, 0, 0, 0.25);

      color: #fff;

    }



    /* GENDER TAGS */

    .gender-tag {

      font-size: 15px;

      padding: 2px 6px;

      border-radius: 4px;

      text-transform: uppercase;

      font-weight: bold;

      color: #fff;

    }

    .gender-m { background-color: #1e88e5; } /* Blue for Male */

    .gender-f { background-color: #e91e63; } /* Pink for Female */



    /* NATION BADGE */

    .nation-flag {

      background-color: rgba(234, 30, 78, 0.5);

      font-size: 15px;

      padding: 2px 6px;

      border-radius: 3px;

      font-weight: bold;

      letter-spacing: 0.5px;

      text-transform: uppercase;

    }



    .bib {

      color: #ffd700;

      font-size: 15px;

      font-weight: bold;

    }



    .time {

      font-weight: bold;

      background: rgba(51,215,241,0.5);

      padding: 2px 6px;

      border-radius: 4px;

    }

  </style>

</head>

<body>



  <div class="ticker-container">

    <div class="badge">

      🏆 OVERALL RANK

    </div>



    <div class="marquee-wrapper">

      <div class="marquee-track" id="ticker-track">

        <span>Loading top runners...</span>

      </div>

    </div>

  </div>



  <script>

    const API_URL = "https://api.raceresult.com/408916/Q5MLR692SSQQMQWPYCMY43PEDXUZ72Q9";



    // Fallback data for testing/offline support

    const MOCK_DATA = [

      { Category: "Marathon", Gender: "M", Nation: "PUR", Name: "Carlos Rivera", Bib: "102", Time: "02:14:32" },

      { Category: "Marathon", Gender: "F", Nation: "USA", Name: "Sarah Jenkins", Bib: "205", Time: "02:28:10" },

      { Category: "Marathon", Gender: "M", Nation: "KEN", Name: "Eliud N.", Bib: "101", Time: "02:05:15" }

    ];



    function renderRunners(runners) {

      const track = document.getElementById("ticker-track");

      track.innerHTML = ""; 



      runners.forEach(runner => {

        const pill = document.createElement("span");

        pill.className = "runner-pill";



        // Handle Gender dynamic class

        const genderRaw = (runner.Gender || "").toUpperCase();

        const isMale = (genderRaw === 'M' || genderRaw === 'MALE');

        const genderClass = isMale ? 'gender-m' : 'gender-f';

        const genderDisplay = isMale ? 'MALE' : 'FEMALE';



        // Handle Country/Nation Code

        const nationDisplay = runner.Nation || runner.Country || 'PUR';



        pill.innerHTML = `

          <span class="rank">RANK #${runner.Rank}</span>
          
          <span class="category">${runner.Category}</span>

          <span class="gender-tag ${genderClass}">${genderDisplay}</span>

          <span class="nation-flag">${nationDisplay}</span>

          <strong>${runner.Name}</strong> 

          <span class="bib">BIB #${runner.Bib}</span>

          <span class="time">${runner.Time}</span>

        `;

        

        track.appendChild(pill);

      });

    }



    async function updateTicker() {

      try {

        const response = await fetch(API_URL);

        if (!response.ok) throw new Error("Network response was not ok");

        const data = await response.json();

        renderRunners(data);

      } catch (err) {

        console.warn("API unavailable or URL not set. Loading mock data...", err);

        renderRunners(MOCK_DATA);

      }

    }



    updateTicker();

    setInterval(updateTicker, 30000);

  </script>



</body>

</html>
