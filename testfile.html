<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Race Results Presentation</title>
  
  <!-- Reveal.js Engine -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/theme/black.min.css">

  <style>
    /* 1. Force Reveal.js to fill 100% of the Screen Area */
    .reveal .slides {
      width: 100% !important;
      height: 100% !important;
      top: 0 !important;
      left: 0 !important;
      margin: 0 !important;
      padding: 20px !important;
      box-sizing: border-box !important;
    }

    .reveal section {
      width: 100% !important;
      height: 100% !important;
      padding: 0 !important;
    }

    /* 2. 2x2 Grid fill complete slide height & width */
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 20px;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }

    /* 3. Runner Card Base Layout */
    .runner-card {
      position: relative;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border: 3px solid #ffffff;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-family: 'Arial', sans-serif;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Overlay shade to ensure text remains readable over photos */
    .runner-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    .card-content-wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    /* 4. Top Badges (Rank & Bib) */
    .card-badge-top-left {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 20px;
      font-weight: bold;
      background: #0056b3;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 3;
    }

    .card-badge-top-right {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 20px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.95);
      color: #1a2b4c;
      padding: 8px 16px;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 3;
    }

    /* 5. Center Overlay Content Styling */
    .card-name {
      font-size: 32px;
      font-weight: bold;
      text-transform: uppercase;
      text-align: center;
      padding: 0 20px;
      margin-bottom: 12px;
      line-height: 1.2;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .card-details {
      font-size: 26px;
      font-weight: bold;
      color: #f1f1f1;
      margin-top: 5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .card-nation {
      font-size: 20px;
      color: #e0e0e0;
      margin-top: 5px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <div class="reveal">
    <div class="slides" id="slides-container">
      <section>
        <h2>Loading Presentation Slides...</h2>
      </section>
    </div>
  </div>

  <!-- Reveal.js JavaScript Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.js"></script>

  <script>
    // New API Endpoint
    const API_ENDPOINT = `https://api.raceresult.com/408916/37CEIHUXMPSYO2U5STLV68IJOVUENA1K`;

    // Fallback images if an entry does not have a photo
    const backgroundPhotos = [
      'photo1.jpg',
      'photo2.jpg',
      'photo3.jpg',
      'photo4.jpg'
    ];

    fetch(API_ENDPOINT)
      .then(response => {
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
        return response.json();
      })
      .then(data => {
        // Extract array depending on RACE RESULT API format structure (Array vs Object list)
        let list = [];
        if (Array.isArray(data)) {
          list = data;
        } else if (data.data) {
          // If returned as object with subfields
          const keys = Object.keys(data.data);
          list = keys.map(k => data.data[k]);
        } else if (typeof data === 'object') {
          // Handle standard indexed objects
          list = Object.values(data)[0] || [];
        }

        if (!list || list.length === 0) {
          document.getElementById('slides-container').innerHTML = "<section><h2>No Participants Found</h2></section>";
          return;
        }

        let slidesHTML = "";

        // Chunk dataset into groups of 4 cards per slide
        for (let i = 0; i < list.length; i += 4) {
          const group = list.slice(i, i + 4);
          
          slidesHTML += `<section><div class="results-grid">`;

          group.forEach((runner, idx) => {
            // Support both named properties and positional array items from API
            const rank = runner.Rank || runner[0] ? `#${runner.Rank || runner[0]}` : "";
            const category = runner.Category || runner[1] || "";
            const bib = runner.Bib || runner[2] || "N/A";
            const name = runner.Name || runner[3] || "Unknown Runner";
            const time = runner.Time || runner[4] || "";
            const nation = runner.Nation || runner[5] || "";

            // Extract Photo field (or search object values for a valid image URL)
            let photoUrl = runner.Photo || runner.Picture || runner.Image || runner[6];

            // Validate and parse the image URL
            if (typeof runner === 'object' && !photoUrl) {
              const possibleUrl = Object.values(runner).find(val => 
                typeof val === 'string' && (val.startsWith('http://') || val.startsWith('https://'))
              );
              if (possibleUrl) photoUrl = possibleUrl;
            }

            // Fallback if no photo is available in API payload
            const bgImage = (photoUrl && photoUrl !== "") ? photoUrl : backgroundPhotos[idx % backgroundPhotos.length];

            slidesHTML += `
              <div class="runner-card" style="background-image: url('${bgImage}');">
                <div class="card-badge-top-left">${category} ${rank}</div>
                <div class="card-badge-top-right">Bib: ${bib}</div>
                
                <div class="card-content-wrapper">
                  <div class="card-name">${name}</div>
                  <div class="card-details">${time ? "Time: " + time : ""}</div>
                  <div class="card-nation">${nation ? "(" + nation + ")" : ""}</div>
                </div>
              </div>
            `;
          });

          slidesHTML += `</div></section>`;
        }

        // Insert generated slides into DOM
        document.getElementById('slides-container').innerHTML = slidesHTML;

        // Initialize Reveal.js Configuration
        Reveal.initialize({
          width: "100%",
          height: "100%",
          margin: 0,
          minScale: 1,
          maxScale: 1,
          controls: true,
          progress: true,
          slideNumber: true,
          keyboard: true,
          loop: true,
          autoSlide: 5000,
          transition: 'convex',
          transitionSpeed: 'slow'
        });
      })
      .catch(err => {
        console.error("API Error:", err);
        document.getElementById('slides-container').innerHTML = "<section><h2>Error Loading Presentation Data</h2></section>";
      });
  </script>
</body>
</html>
