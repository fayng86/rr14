<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Race Results Slide Presentation</title>
  
  <!-- Reveal.js Engine for Slide Transitions -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/theme/black.min.css">

  <style>
    /* 16:9 Widescreen Slide Dimensions */
    .reveal .slides {
      width: 1280px !important;
      height: 100% !important;
    }

    /* 2x2 Grid Layout for 4 Cards per Slide */
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 20px;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 10px;
    }

    /* Individual Participant Card Layout */
    .runner-card {
      position: relative;
      background-image: url('certificate-template.png.jpg'); /* Background image in your repo */
      background-size: cover;
      background-position: center;
      border: 2px solid #ffffff;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #1a2b4c;
      font-family: Arial, sans-serif;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    /* Top Badges (Rank, Category, Bib) */
    .card-badge-top-left {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 16px;
      font-weight: bold;
      background: #0056b3;
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .card-badge-top-right {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 16px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.9);
      color: #1a2b4c;
      padding: 4px 10px;
      border-radius: 4px;
    }

    /* Text Overlays inside each card */
    .card-name {
      font-size: 24px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-align: center;
      padding: 0 15px;
    }

    .card-details {
      font-size: 18px;
      color: #333;
      margin-top: 5px;
    }

    .card-nation {
      font-size: 14px;
      color: #666;
      margin-top: 2px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="reveal">
    <div class="slides" id="slides-container">
      <section>
        <h2>Loading Presentation Slides...</h2>
      </section>
    </div>
  </div>

  <!-- Reveal.js JavaScript Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.js"></script>

  <script>
    // Replace with your actual RACE RESULT 14 JSON API endpoint
    const API_ENDPOINT = `https://api.raceresult.com/408916/Q5MLR692SSQQMQWPYCMY43PEDXUZ72Q9`;

    fetch(API_ENDPOINT)
      .then(response => {
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
        return response.json();
      })
      .then(data => {
        const list = Array.isArray(data) ? data : (data.list || data.participants || data.data || []);

        if (list.length === 0) {
          document.getElementById('slides-container').innerHTML = "<section><h2>No Participants Found</h2></section>";
          return;
        }

        let slidesHTML = "";

        // Loop through array and group into sets of 4 cards per slide
        for (let i = 0; i < list.length; i += 4) {
          const group = list.slice(i, i + 4);
          
          slidesHTML += `<section><div class="results-grid">`;

          group.forEach(runner => {
            // Mapping fields explicitly to match your JSON keys
            const rank = runner.Rank ? `#${runner.Rank}` : "";
            const category = runner.Category || "";
            const bib = runner.Bib || "N/A";
            const name = runner.Name || "Unknown Runner";
            const time = runner.Time || "";
            const nation = runner.Nation || "";

            slidesHTML += `
              <div class="runner-card">
                <div class="card-badge-top-left">${category} ${rank}</div>
                <div class="card-badge-top-right">Bib: ${bib}</div>
                
                <div class="card-name">${name}</div>
                <div class="card-details">${time ? "Time: " + time : ""}</div>
                <div class="card-nation">${nation ? "(" + nation + ")" : ""}</div>
              </div>
            `;
          });

          slidesHTML += `</div></section>`;
        }

        // Insert generated slides into the presentation container
        document.getElementById('slides-container').innerHTML = slidesHTML;

        // Initialize Reveal.js Slideshow Controls
        Reveal.initialize({
          controls: true,        // Displays navigation arrows on screen
          progress: true,        // Displays bottom progress bar
          slideNumber: true,     // Shows current slide number
          keyboard: true,        // Navigate using keyboard arrows
          loop: true,            // Auto-loops back to slide 1 at the end
          autoSlide: 5000,       // Auto-advances slides every 5 seconds (5000ms)
          transition: 'fade'     // Smooth transition between slides
        });
      })
      .catch(err => {
        console.error("API Error:", err);
        document.getElementById('slides-container').innerHTML = "<section><h2>Error Loading Presentation Data</h2></section>";
      });
  </script>
</body>
</html>
